<script type="module">// YAMO Captions tool: audio -> whisper (client-side) -> styled captions -> webm export
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
env.allowLocalModels = false;
const $ = id => document.getElementById(id);
const log = m => { const d=$('log'); d.textContent += m + '\n'; d.scrollTop = d.scrollHeight; };
let ASR = null, audioBuf = null, audioURL = null, style = 'karaoke';
let SEGS = [];

async function getASR(cb) {
  if (ASR) return ASR;
  let hasGPU = false;
  try { hasGPU = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch (e) { hasGPU = false; }
  log(hasGPU ? 'WebGPU متاح — التفريغ هيكون أسرع' : 'مفيش WebGPU — التفريغ على المعالج (أبطأ)');
  ASR = await pipeline('automatic-speech-recognition', 'onnx-community/whisper-large-v3-turbo', {
    dtype: 'q4', device: hasGPU ? 'webgpu' : 'wasm',
    progress_callback: p => { if (p.status === 'progress' && cb) cb(p); }
  });
  return ASR;
}

$('file').onchange = () => {
  const f = $('file').files[0]; if (!f) return;
  audioURL = URL.createObjectURL(f);
  $('player').src = audioURL;
  $('go').disabled = false;
  log('الملف: ' + f.name + ' (' + Math.round(f.size/1024) + ' KB)');
};

$('go').onclick = async () => {
  const f = $('file').files[0]; if (!f) return;
  $('go').disabled = true; $('prog-wrap').hidden = false;
  try {
    log('بيجهّز الموديل (أول مرة بس — بينزل ~800MB ويتخزن)...');
    const asr = await getASR(p => { if (p.total) { $('prog').value = p.loaded / p.total * 100; $('prog-txt').textContent = Math.round(p.loaded/1e6) + 'MB / ' + Math.round(p.total/1e6) + 'MB'; } });
    log('الموديل جاهز. بيفك الصوت...');
    const raw = await f.arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    audioBuf = await ac.decodeAudioData(raw);
    const ch = audioBuf.getChannelData(0);
    log('بيفرّغ الصوت... (' + Math.round(audioBuf.duration) + ' ثانية)');
    const t0 = performance.now();
    const out = await asr(ch, { language: 'arabic', task: 'transcribe', return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 });
    log('التفريغ خلص في ' + Math.round((performance.now()-t0)/1000) + ' ثانية');
    window.WORDS = []; window.WORDS = window.WORDS;
    for (const c of (out.chunks || [])) {
      const ws = c.text.trim().split(/\s+/).filter(Boolean);
      const t0c = c.timestamp[0] ?? 0, t1c = c.timestamp[1] ?? (t0c + ws.length * 0.4);
      ws.forEach((w, i) => window.WORDS.push({ text: w, start: t0c + (t1c - t0c) * i / ws.length, end: t0c + (t1c - t0c) * (i + 1) / ws.length }));
    }
    if (!window.WORDS.length) { log('مفيش كلام اتكشف في الصوت!'); return; }
    // group into scenes ~3s
    SEGS = []; let cur = null;
    for (let i = 0; i < window.WORDS.length; i++) {
      const w = window.WORDS[i];
      if (!cur || w.start - cur.s > 3 || i - cur.from >= 7) { cur = { from: i, to: i, s: w.start, e: w.end, lead:'', hero:w.text, tail:'' }; SEGS.push(cur); }
      else { cur.to = i; cur.e = w.end; cur.hero += ' ' + w.text; }
    }
    window.WORDS = window.WORDS;
    $('text').value = window.WORDS.map(w => w.text).join(' ');
    $('step2').hidden = false;
    $('player').onseeked = $('player').ontimeupdate = () => paintFrame();
    paintFrame();
    log('المعاينة جاهزة — اختار ستايل وشغّل');
  } catch (e) { log('خطأ: ' + e.message); }
  $('go').disabled = false;
};

const SUBSET = ['karaoke','marker','pop','glowcyan','wordlight','classic','boxed','yellow','gradient','pill','lowerthird','meme','twotone','arabesque','typewriter','bounce','glitch','vhs','bigword','comic','cyber','center','waver','neon'];
SUBSET.unshift('batal','wahaj','efte','collage','kelma','shara','pkara','amlaqa','punch','hype','numeral','edito','billboard','phigh','news','glass');
 $('style').innerHTML = SUBSET.map(s => '<option value="' + s + '">' + (SUB[s] ? SUB[s].name : (PRO[s] || SCENE_STYLES[s])) + '</option>').join('');
$('style').onchange = e => { style = e.target.value; window.STYLE = e.target.value; paintFrame(); };

function paintFrame() {
  const v = $('player');
  paint($('c'), v, v.currentTime || 0, SEGS);
}

// export webm
$('export').onclick = async () => {
  const v = $('player'); if (!SEGS.length) return;
  $('export').disabled = true;
  const c = $('c');
  const stream = c.captureStream(30);
  const ac = new AudioContext();
  const src = ac.createMediaElementSource(v);
  const dest = ac.createMediaStreamDestination();
  src.connect(dest); src.connect(ac.destination);
  const merged = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const rec = new MediaRecorder(merged, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm' });
  const parts = []; rec.ondataavailable = e => parts.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(parts, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'yamo-caption.webm'; a.click();
    log('اتصدّر الفيديو (webm). للـ Premiere: حمّل ملف الـ SRT واستورده كـ caption track');
    $('export').disabled = false;
  };
  v.currentTime = 0; await v.play();
  cancelAnimationFrame(window.__raf);
  const loop = () => { paintFrame(); window.__raf = requestAnimationFrame(loop); };
  loop(); rec.start(200);
  v.onended = () => { rec.stop(); cancelAnimationFrame(window.__raf); v.onended = null; };
  log('بيصدّر الفيديو...');
};

// SRT export
$('srt').onclick = () => {
  if (!SEGS.length) return;
  const ts = t => { const h = String(Math.floor(t/3600)).padStart(2,'0'), m = String(Math.floor(t%3600/60)).padStart(2,'0'), s = String(Math.floor(t%60)).padStart(2,'0'), ms = String(Math.round(t%1*1000)).padStart(3,'0'); return h+':'+m+':'+s+','+ms; };
  const srt = SEGS.map((z,i) => (i+1) + '\n' + ts(z.s) + ' --> ' + ts(z.e) + '\n' + window.WORDS.slice(z.from, z.to+1).map(w=>w.text).join(' ') + '\n').join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([srt], { type: 'text/plain' })); a.download = 'captions.srt'; a.click();
  log('اتصدّر ملف SRT — يتستورد في Premiere مباشرة');
};

// playback wiring
$('playb').onclick = async () => {
  const v = $('player');
  if (v.paused) { await v.play(); cancelAnimationFrame(window.__raf); const loop=()=>{paintFrame();window.__raf=requestAnimationFrame(loop)}; loop(); $('playb').textContent = 'وقّف'; }
  else { v.pause(); cancelAnimationFrame(window.__raf); $('playb').textContent = 'شغّل'; }
};
</script>
