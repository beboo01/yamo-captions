function proNorm(w){return (w||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/[^ء-غف-ي٠-٩a-zA-Z0-9]/g,'')}
function proEmo(w){const k=PRO_EMO_MAP[proNorm(w)];return k?PRO_IMG[k]:null}
function backOut2(x){x=Math.max(0,Math.min(1,x));const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function emoDraw(x,img,cx,cy,size,pe,t,seed){
 if(!img||!img.complete||!img.naturalWidth||pe<=0)return;
 const c=Math.max(0,Math.min(1,pe)),s=size*backOut2(c);
 x.save();x.translate(cx,cy+Math.sin(t*3+seed*1.7)*7);x.rotate((1-c)*-.55);x.globalAlpha*=Math.min(1,c*2.2);
 x.drawImage(img,-s/2,-s/2,s,s);x.restore();
}
function proPaint(x,v,t,z,key){
 const W=1080,H=1920;
 const words=WORDS.slice(z.from,z.to+1);if(!words.length)return;
 const n=words.length,st=i=>words[i].start,en=i=>words[i].end;
 const p=i=>Math.max(0,Math.min(1,(t-st(i))/.25));
 let act=-1;for(let i=0;i<n;i++)if(t>=st(i)&&t<en(i)){act=i;break}
 if(act<0)for(let i=n-1;i>=0;i--)if(t>=en(i)){act=i;break}
 const kw=words.reduce((b,w,i)=>proNorm(w.text).length>proNorm(words[b].text).length?i:b,0);
 x.save();x.direction='rtl';x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
 x.globalAlpha=Math.max(0,Math.min(1,(z.e-t)/.14,(t-z.s)/.18+ .0001)||1);
 let curFit=1;
 const wdir=words.map(w=>{const m=w.text.match(/[A-Za-zء-ي]/);return m?(/[A-Za-z]/.test(m[0])?'l':'a'):''});
 let para='';for(let i=0;i<n;i++)if(wdir[i]){para=wdir[i];break}
 if(!para)para='a';
 const dir2=wdir.map((d,i)=>{if(d)return d;for(let k=i-1;k>=0;k--)if(wdir[k])return wdir[k];return para});
 const vo=(()=>{const runs=[];let cur2=[dir2[0],0];
  for(let i=1;i<n;i++){if(dir2[i]===dir2[cur2[1]]){}else{runs.push([dir2[cur2[1]],cur2[1],i-1]);cur2=[dir2[i],i];}}
  runs.push([dir2[cur2[1]],cur2[1],n-1]);
  const out=[];
  const emit=(r)=>{const arr=[];for(let i=r[1];i<=r[2];i++)arr.push(i);if(r[0]==='a')arr.reverse();out.push(...arr);};
  if(para==='a'){for(let r=runs.length-1;r>=0;r--)emit(runs[r]);}
  else{for(let r=0;r<runs.length;r++)emit(runs[r]);}
  return out;})();
 function lay(px,font,weight,maxw){
  x.font=(weight||700)+' '+px+'px '+font+',sans-serif';
  const gap=px*.38,ws=words.map(w=>x.measureText(w.text).width);

  return{ws,fit,bx};
 }
 function drawW(i,bx,y,fill,stroke,sw,scale){

 }

function ease2(x){return 1-Math.pow(1-Math.max(0,Math.min(1,x)),4)}
function subPaint(x,t,z,o){
 const words=WORDS.slice(z.from,z.to+1);
 const current=words.findIndex(w=>t>=w.start&&t<w.end);
 const groupStart=o.type?0:Math.floor(Math.max(0,current)/4)*4;
 const chunk=words.slice(groupStart,groupStart+4);
 if(!chunk.length)return;
 const y=(o.top?0.16:0.80)*1920,px=o.px||68;
 x.save();x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
 x.font=(o.weight||700)+' '+px+'px '+(o.font||'CapCairo')+',sans-serif';
 let text=chunk.map(w=>w.text).join(' ');
 // entrance animations
 let enter=1,dy=0;
 const a=z.s;
 if(o.bounce){const q=Math.min(1,(t-a)/.45);enter=q;dy=(1-ease2(q))*-160+Math.sin(Math.min(1,(t-a)/.45)*Math.PI*2)*(1-q)*22}
 else{enter=Math.min(1,(t-a)/.25);dy=(1-ease2(enter))*40}
 if(o.type){const total=text.length,shown=Math.max(0,Math.floor((t-a)/(z.e-z.s)*total*1.15));text=text.slice(0,shown)}
 const fade=Math.min(1,(t-a)/.18,(z.e-t)/.12||1);
 x.globalAlpha=Math.max(0,Math.min(1,fade))* (o.type?1:enter);
 x.translate(540,y+dy);
 const measured=x.measureText(text).width,fit=Math.min(1,930/measured);
 x.scale(fit,fit);
 if(o.band){x.globalAlpha*=.97;x.fillStyle=o.band;x.beginPath();x.roundRect(-510,-px*1.05,1020,px*2.1,6);x.fill()}
 if(o.bar){x.fillStyle='rgba(8,10,16,.88)';x.fillRect(-540,-px*.95,1080,px*1.9);x.fillStyle=o.accent;x.fillRect(500,-px*.95,40,px*1.9)}
 if(o.pill){x.fillStyle=o.box;x.beginPath();x.roundRect(-measured/2-34,-px*.8,measured+68,px*1.62,px*.8);x.fill()}
 else if(o.box&&!o.band){x.fillStyle=o.box;x.beginPath();x.roundRect(-measured/2-26,-px*.78,measured+52,px*1.58,8);x.fill()}
 // per-word rendering for active styles
 if(o.active||o.fills||o.marker||o.sweep||o.pop){
  const widths=chunk.map(w=>x.measureText(w.text).width),gap=22,total=widths.reduce((p,n)=>p+n,0)+gap*(chunk.length-1);let cursor=total/2;
  for(let i=0;i<chunk.length;i++){const w=chunk[i],active=t>=w.start&&t<w.end,xx=cursor-widths[i]/2;
   x.save();x.translate(xx,0);
   if(o.pop&&active){const q=(t-w.start)/Math.max(.01,w.end-w.start);const s=1+.28*Math.sin(Math.min(1,q*1.6)*Math.PI);x.scale(s,s)}
   if(o.marker&&active){const q=Math.min(1,(t-w.start)/.22);x.fillStyle=o.marker;x.beginPath();x.roundRect(-widths[i]/2-10,-px*.66,(widths[i]+20)*q,px*1.32,6);x.fill()}
   if(o.activeBox&&active){x.fillStyle=o.activeBox;x.beginPath();x.roundRect(-widths[i]/2-12,-px*.72,widths[i]+24,px*1.45,10);x.fill()}
   if(o.glow&&active){x.shadowColor=o.glow;x.shadowBlur=15}
   x.fillStyle=o.fills?o.fills[i%2]:(active&&o.active?o.active:o.fill);
   x.lineJoin='round';x.lineWidth=o.sw||5;x.strokeStyle=o.stroke||'rgba(0,0,0,.85)';
   if((o.sw||5)>0)x.strokeText(w.text,0,0);x.fillText(w.text,0,0);
   if(o.sweep&&active){const q=Math.max(0,Math.min(1,(t-w.start)/(w.end-w.start)));x.save();x.beginPath();x.rect(-widths[i]/2-4,-px,widths[i]*q+8,px*2);x.clip();x.fillStyle=o.sweep;x.lineJoin='round';x.lineWidth=o.sw||5;x.strokeStyle=o.stroke;x.strokeText(w.text,0,0);x.fillText(w.text,0,0);x.restore()}
   x.restore();cursor-=widths[i]+gap}
 }else{
  if(o.hardShadow){x.fillStyle=o.hardShadow;x.fillText(text,7,7)}
  if(o.glowPulse){x.shadowColor=o.glowPulse;x.shadowBlur=18+10*Math.sin(t*4)}
  let fill=o.fill;
  if(fill==='__grad'){const g=x.createLinearGradient(-measured/2,0,measured/2,0);g.addColorStop(0,o.g1);g.addColorStop(1,o.g2);fill=g}
  x.fillStyle=fill;x.lineJoin='round';x.lineWidth=o.sw||5;x.strokeStyle=o.stroke||'rgba(0,0,0,.85)';
  if((o.sw||5)>0&&o.fill!=='rgba(0,0,0,0)')x.strokeText(text,0,0);
  if(o.fill==='rgba(0,0,0,0)'){x.strokeText(text,0,0)}else{x.fillText(text,0,0)}
 }
 x.restore();
}

<script>
// Yamo resumable model downloads (free, client-side).
// Completed files land in the standard 'transformers-cache' Cache storage so the
// stock pipeline reads them. Partial progress lives in IndexedDB and survives refresh.
// Usage: env.customCache = makeResumableCache({onProgress}) before pipeline().
(function(root){
const DB='yamo-model-resume', CHUNK=4*1024*1024;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('parts')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(db,k){return new Promise((res,rej)=>{const t=db.transaction('parts').objectStore('parts').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
async function idbPut(db,k,v){return new Promise((res,rej)=>{const t=db.transaction('parts','readwrite').objectStore('parts').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
async function idbDelPrefix(db,prefix){return new Promise((res,rej)=>{
 const t=db.transaction('parts','readwrite'),s=t.objectStore('parts'),cur=s.openCursor();
 cur.onsuccess=()=>{const c=cur.result;if(!c){res();return}
  if(String(c.key).startsWith(prefix))c.delete();c.continue()};cur.onerror=()=>rej(cur.error)})}

async function fetchRangeRetry(url,start,end,tries){
 for(let i=0;;i++){
  try{
   const r=await fetch(url,{headers:{Range:`bytes=${start}-${end-1}`}});
   if(r.status===206){
    const blob=await r.blob();
    if(blob.size!==end-start)throw Error('RETRYABLE_short');
    return blob;
   }
   if(r.status===404||r.status===403||r.status===416)throw Error('RESUME_RANGE_FAILED');
   throw Error('RETRYABLE_'+r.status);
  }catch(e){
   if(i>=tries-1||!String(e&&e.message).startsWith('RETRYABLE'))throw e;
   await new Promise(res=>setTimeout(res,500*Math.pow(3,i)));
  }
 }
}

async function resumableFetch(url,onProgress){
 const db=await idbOpen();
 // probe: size + etag + range support
 const probe=await fetch(url,{headers:{Range:'bytes=0-0'}});
 if(probe.status===404||probe.status===403||probe.status>=500)throw Error('RESUME_NOT_FOUND');
 if(probe.status!==206){ // no range support: single-shot fallback, no mid-file resume
  if(probe.status!==200)throw Error('RESUME_PROBE_FAILED');
  const blob=await probe.blob(); onProgress&&onProgress(blob.size,blob.size,false); return blob; }
 const cr=probe.headers.get('Content-Range')||'';
 const total=+((cr.match(/\/(\d+)$/)||[])[1]||0);
 const etag=probe.headers.get('ETag')||'';
 if(!total)throw Error('RESUME_PROBE_FAILED');
 const meta=await idbGet(db,'meta:'+url);
 if(meta&&(meta.total!==total||meta.etag!==etag))await idbDelPrefix(db,url+':'); // file changed upstream: restart
 let chunks=(await idbGet(db,url+':index'))||[];
 chunks=chunks.filter(c=>c.end<=total);
 let loaded=chunks.reduce((a,c)=>a+(c.end-c.start),0);
 onProgress&&onProgress(loaded,total,true);
 while(loaded<total){
  // first uncovered byte in sorted chunk list
  chunks.sort((a,b)=>a.start-b.start);
  let start=0;for(const c of chunks){if(c.start>start)break;start=Math.max(start,c.end)}
  const end=Math.min(start+CHUNK,total);
  const blob=await fetchRangeRetry(url,start,end,4);
  await idbPut(db,url+':'+start,blob);
  chunks.push({start,end});await idbPut(db,url+':index',chunks);
  await idbPut(db,'meta:'+url,{total,etag});
  loaded+=blob.size;onProgress&&onProgress(loaded,total,true);
 }
 // assemble
 const parts=[];chunks.sort((a,b)=>a.start-b.start);
 let expect=0;
 for(const c of chunks){if(c.start!==expect)throw Error('RESUME_GAP');parts.push(await idbGet(db,url+':'+c.start));expect=c.end}
 const full=new Blob(parts);
 if(full.size!==total)throw Error('RESUME_SIZE_MISMATCH');
 await idbDelPrefix(db,url+':');
 return full;
}

function makeResumableCache(realCache,onProgress){
 return {
  async match(req){
   const hit=await realCache.match(req);if(hit)return hit;
   const url=typeof req==='string'?req:req.url;
   if(!/^https?:/i.test(url))return undefined; // local-path candidates: plain miss
   let blob;
   try{blob=await resumableFetch(url,onProgress)}
   catch(e){if(e&&e.message==='RESUME_NOT_FOUND')return undefined;throw e}
   const resp=new Response(blob,{status:200,headers:{'Content-Type':'application/octet-stream'}});
   await realCache.put(req,resp.clone());
   return resp;
  },
  async put(req,resp){return realCache.put(req,resp)}
 };
}
const api={makeResumableCache,resumableFetch,CHUNK};
if(typeof module==='object'&&module.exports)module.exports=api;else root.YamoResume=api;
})(globalThis);

</script>
<script type="module">// YAMO Captions tool: audio -> whisper (client-side) -> styled captions -> webm export
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
env.allowLocalModels = false;
const $ = id => document.getElementById(id);
const log = m => { const d=$('log'); d.textContent += m + '\n'; d.scrollTop = d.scrollHeight; };
let ASR = null, audioBuf = null, audioURL = null, style = 'karaoke';
let SEGS = [];

async function getASR(cb) {
  if (ASR) return ASR;
  const model = ($('model') && $('model').value) || 'onnx-community/whisper-large-v3-turbo';
  let hasGPU = false;
  try { hasGPU = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch (e) { hasGPU = false; }
  log(hasGPU ? 'WebGPU متاح — التفريغ هيكون أسرع' : 'مفيش WebGPU — التفريغ على المعالج (أبطأ)');
  // تحميل على دفعات 4MB بتتخزن في IndexedDB وبيكمّل من حيث وقف لو النت قطع —
  // يحمي الأجهزة الضعيفة من ضغط الذاكرة أثناء التحميل (إصلاح كراش "Aw, Snap!")
  if (window.YamoResume) {
    env.useCustomCache = true;
    env.customCache = YamoResume.makeResumableCache(await caches.open('transformers-cache'),
      (loaded, total) => { if (cb) cb({ loaded, total }); });
  }
  log('الموديل: ' + model.split('/').pop() + ' — التحميل بيكمّل من حيث وقف لو النت قطع');
  if ($('model')) $('model').disabled = true;
  ASR = await pipeline('automatic-speech-recognition', model, {
    dtype: 'q4', device: hasGPU ? 'webgpu' : 'wasm',
    progress_callback: p => { if (p.status === 'progress' && cb) cb(p); }
  });
  return ASR;
}
// حفظ اختيار الموديل للمرة الجاية
if ($('model')) {
  const saved = localStorage.getItem('yamoModelChoice');
  if (saved) $('model').value = saved;
  $('model').onchange = () => localStorage.setItem('yamoModelChoice', $('model').value);
}

$('file').onchange = () => {
  const f = $('file').files[0]; if (!f) return;
  audioURL = URL.createObjectURL(f);
  $('player').src = audioURL;
  $('go').disabled = false;
  log('الملف: ' + f.name + ' (' + Math.round(f.size/1024) + ' KB)');
};

$('go').onclick = async () => {
  const f = $('file').files[0]; if (!f) return;
  $('go').disabled = true; $('prog-wrap').hidden = false;
  try {
    log('بيجهّز الموديل (أول مرة بس — بينزل ويتخزن على جهازك)...');
    const asr = await getASR(p => { if (p.total) { $('prog').value = p.loaded / p.total * 100; $('prog-txt').textContent = Math.round(p.loaded/1e6) + 'MB / ' + Math.round(p.total/1e6) + 'MB'; } });
    log('الموديل جاهز. بيفك الصوت...');
    const raw = await f.arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    audioBuf = await ac.decodeAudioData(raw);
    ac.close(); // free the context: Chrome caps live AudioContexts (~6) and each run would leak one
    const ch = audioBuf.getChannelData(0);
    log('بيفرّغ الصوت... (' + Math.round(audioBuf.duration) + ' ثانية)');
    const t0 = performance.now();
    const out = await asr(ch, { language: 'arabic', task: 'transcribe', return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 });
    log('التفريغ خلص في ' + Math.round((performance.now()-t0)/1000) + ' ثانية');
    window.WORDS = []; window.WORDS = window.WORDS;
    for (const c of (out.chunks || [])) {
      const ws = c.text.trim().split(/\s+/).filter(Boolean);
      const t0c = c.timestamp[0] ?? 0, t1c = c.timestamp[1] ?? (t0c + ws.length * 0.4);
      ws.forEach((w, i) => window.WORDS.push({ text: w, start: t0c + (t1c - t0c) * i / ws.length, end: t0c + (t1c - t0c) * (i + 1) / ws.length }));
    }
    if (!window.WORDS.length) { log('مفيش كلام اتكشف في الصوت!'); return; }
    // group into scenes ~3s
    SEGS = []; let cur = null;
    for (let i = 0; i < window.WORDS.length; i++) {
      const w = window.WORDS[i];
      if (!cur || w.start - cur.s > 3 || i - cur.from >= 7) { cur = { from: i, to: i, s: w.start, e: w.end, lead:'', hero:w.text, tail:'' }; SEGS.push(cur); }
      else { cur.to = i; cur.e = w.end; cur.hero += ' ' + w.text; }
    }
    window.WORDS = window.WORDS;
    $('text').value = window.WORDS.map(w => w.text).join(' ');
    $('step2').hidden = false;
    $('player').onseeked = $('player').ontimeupdate = () => paintFrame();
    paintFrame();
    log('المعاينة جاهزة — اختار ستايل وشغّل');
  } catch (e) { log('خطأ: ' + e.message); }
  $('go').disabled = false;
};

const SUBSET = ['karaoke','marker','pop','glowcyan','wordlight','classic','boxed','yellow','gradient','pill','lowerthird','meme','twotone','arabesque','typewriter','bounce','glitch','vhs','bigword','comic','cyber','center','waver','neon'];
SUBSET.unshift('batal','wahaj','efte','collage','kelma','shara','pkara','amlaqa','punch','hype','numeral','edito','billboard','phigh','news','glass','slider','sticker','moga','qlab','sellem','spot','gazabeya','halaq','tabaa','balloon','sebaq','mkaeb','sarkha','salasel','addad','fqa','harf');
 $('style').innerHTML = SUBSET.map(s => '<option value="' + s + '">' + (SUB[s] ? SUB[s].name : (PRO[s] || SCENE_STYLES[s])) + '</option>').join('');
$('style').onchange = e => { style = e.target.value; window.STYLE = e.target.value; paintFrame(); };

function paintFrame() {
  const v = $('player');
  paint($('c'), v, v.currentTime || 0, SEGS);
}

// export webm
$('export').onclick = async () => {
  const v = $('player'); if (!SEGS.length) return;
  $('export').disabled = true;
  const c = $('c');
  try {
  const stream = c.captureStream(30);
  // a MediaElementSourceNode binds the element permanently: create it once and
  // reuse it across exports, otherwise the second export on the same element throws
  const ac = window.__ac || (window.__ac = new AudioContext());
  const src = window.__mes || (window.__mes = ac.createMediaElementSource(v));
  if (window.__mesDest) { try { src.disconnect(window.__mesDest); } catch (e) {} }
  const dest = ac.createMediaStreamDestination();
  window.__mesDest = dest;
  src.connect(dest);
  if (!window.__mesLive) { src.connect(ac.destination); window.__mesLive = true; }
  const merged = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const rec = new MediaRecorder(merged, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm' });
  const parts = []; rec.ondataavailable = e => parts.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(parts, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'yamo-caption.webm'; a.click();
    log('اتصدّر الفيديو (webm). للـ Premiere: حمّل ملف الـ SRT واستورده كـ caption track');
    $('export').disabled = false;
  };
  v.currentTime = 0; await v.play();
  cancelAnimationFrame(window.__raf);
  const loop = () => { paintFrame(); window.__raf = requestAnimationFrame(loop); };
  loop(); rec.start(200);
  v.onended = () => { rec.stop(); cancelAnimationFrame(window.__raf); v.onended = null; };
  log('بيصدّر الفيديو...');
  } catch (err) { log('فشل التصدير: ' + ((err && err.message) || err)); $('export').disabled = false; }
};

// SRT export
$('srt').onclick = () => {
  if (!SEGS.length) return;
  const ts = t => { const h = String(Math.floor(t/3600)).padStart(2,'0'), m = String(Math.floor(t%3600/60)).padStart(2,'0'), s = String(Math.floor(t%60)).padStart(2,'0'), ms = String(Math.round(t%1*1000)).padStart(3,'0'); return h+':'+m+':'+s+','+ms; };
  const srt = SEGS.map((z,i) => (i+1) + '\n' + ts(z.s) + ' --> ' + ts(z.e) + '\n' + window.WORDS.slice(z.from, z.to+1).map(w=>w.text).join(' ') + '\n').join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([srt], { type: 'text/plain' })); a.download = 'captions.srt'; a.click();
  log('اتصدّر ملف SRT — يتستورد في Premiere مباشرة');
};

// playback wiring
$('playb').onclick = async () => {
  const v = $('player');
  if (v.paused) { await v.play(); cancelAnimationFrame(window.__raf); const loop=()=>{paintFrame();window.__raf=requestAnimationFrame(loop)}; loop(); $('playb').textContent = 'وقّف'; }
  else { v.pause(); cancelAnimationFrame(window.__raf); $('playb').textContent = 'شغّل'; }
};
</script>
