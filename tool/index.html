function ease2(x){return 1-Math.pow(1-Math.max(0,Math.min(1,x)),4)}
function subPaint(x,t,z,o){
 const words=WORDS.slice(z.from,z.to+1);
 const current=words.findIndex(w=>t>=w.start&&t<w.end);
 const groupStart=o.type?0:Math.floor(Math.max(0,current)/4)*4;
 const chunk=words.slice(groupStart,groupStart+4);
 if(!chunk.length)return;
 const y=(o.top?0.16:0.80)*1920,px=o.px||68;
 x.save();x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
 x.font=(o.weight||700)+' '+px+'px '+(o.font||'CapCairo')+',sans-serif';
 let text=chunk.map(w=>w.text).join(' ');
 // entrance animations
 let enter=1,dy=0;
 const a=z.s;
 if(o.bounce){const q=Math.min(1,(t-a)/.45);enter=q;dy=(1-ease2(q))*-160+Math.sin(Math.min(1,(t-a)/.45)*Math.PI*2)*(1-q)*22}
 else{enter=Math.min(1,(t-a)/.25);dy=(1-ease2(enter))*40}
 if(o.type){const total=text.length,shown=Math.max(0,Math.floor((t-a)/(z.e-z.s)*total*1.15));text=text.slice(0,shown)}
 const fade=Math.min(1,(t-a)/.18,(z.e-t)/.12||1);
 x.globalAlpha=Math.max(0,Math.min(1,fade))* (o.type?1:enter);
 x.translate(540,y+dy);
 const measured=x.measureText(text).width,fit=Math.min(1,930/measured);
 x.scale(fit,fit);
 if(o.band){x.globalAlpha*=.97;x.fillStyle=o.band;x.beginPath();x.roundRect(-510,-px*1.05,1020,px*2.1,6);x.fill()}
 if(o.bar){x.fillStyle='rgba(8,10,16,.88)';x.fillRect(-540,-px*.95,1080,px*1.9);x.fillStyle=o.accent;x.fillRect(500,-px*.95,40,px*1.9)}
 if(o.pill){x.fillStyle=o.box;x.beginPath();x.roundRect(-measured/2-34,-px*.8,measured+68,px*1.62,px*.8);x.fill()}
 else if(o.box&&!o.band){x.fillStyle=o.box;x.beginPath();x.roundRect(-measured/2-26,-px*.78,measured+52,px*1.58,8);x.fill()}
 // per-word rendering for active styles
 if(o.active||o.fills||o.marker||o.sweep||o.pop){
  const widths=chunk.map(w=>x.measureText(w.text).width),gap=22,total=widths.reduce((p,n)=>p+n,0)+gap*(chunk.length-1);let cursor=total/2;
  for(let i=0;i<chunk.length;i++){const w=chunk[i],active=t>=w.start&&t<w.end,xx=cursor-widths[i]/2;
   x.save();x.translate(xx,0);
   if(o.pop&&active){const q=(t-w.start)/Math.max(.01,w.end-w.start);const s=1+.28*Math.sin(Math.min(1,q*1.6)*Math.PI);x.scale(s,s)}
   if(o.marker&&active){const q=Math.min(1,(t-w.start)/.22);x.fillStyle=o.marker;x.beginPath();x.roundRect(-widths[i]/2-10,-px*.66,(widths[i]+20)*q,px*1.32,6);x.fill()}
   if(o.activeBox&&active){x.fillStyle=o.activeBox;x.beginPath();x.roundRect(-widths[i]/2-12,-px*.72,widths[i]+24,px*1.45,10);x.fill()}
   if(o.glow&&active){x.shadowColor=o.glow;x.shadowBlur=15}
   x.fillStyle=o.fills?o.fills[i%2]:(active&&o.active?o.active:o.fill);
   x.lineJoin='round';x.lineWidth=o.sw||5;x.strokeStyle=o.stroke||'rgba(0,0,0,.85)';
   if((o.sw||5)>0)x.strokeText(w.text,0,0);x.fillText(w.text,0,0);
   if(o.sweep&&active){const q=Math.max(0,Math.min(1,(t-w.start)/(w.end-w.start)));x.save();x.beginPath();x.rect(-widths[i]/2-4,-px,widths[i]*q+8,px*2);x.clip();x.fillStyle=o.sweep;x.lineJoin='round';x.lineWidth=o.sw||5;x.strokeStyle=o.stroke;x.strokeText(w.text,0,0);x.fillText(w.text,0,0);x.restore()}
   x.restore();cursor-=widths[i]+gap}
 }else{
  if(o.hardShadow){x.fillStyle=o.hardShadow;x.fillText(text,7,7)}
  if(o.glowPulse){x.shadowColor=o.glowPulse;x.shadowBlur=18+10*Math.sin(t*4)}

}
function scenePaint(x,v,t,z,variant){
 const d=z.e-z.s,a=Math.max(.001,t-z.s),fade=Math.min(1,(d-a)/.14),enter=ease2(a/.32);
 const W=1080,H=1920;
 x.save();x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
 const hero=z.hero,lead=z.lead,tail=z.tail;
 const cy=H*.48;
 x.globalAlpha=fade;
 if(variant==='glitch'){
  const j=(Math.sin(t*37)>0.55?1:0)*8;
  x.font='900 120px CapCairo,sans-serif';const fit=Math.min(1,880/x.measureText(hero).width);x.save();x.translate(540,cy+(1-enter)*60);x.scale(fit,fit);
  x.globalAlpha=fade*.8;x.fillStyle='#0ff';x.fillText(hero,-j, j);x.fillStyle='#f0f';x.fillText(hero,j,-j);
  x.globalAlpha=fade;x.fillStyle='#fff';x.fillText(hero,0,0);x.restore();
  if(Math.sin(t*23)>0.7){x.fillStyle='rgba(255,255,255,.15)';for(let k=0;k<3;k++)x.fillRect(0,Math.random()*H,W,6)}
  x.font='700 52px CapAmiri,sans-serif';x.fillStyle='#ffe45b';x.fillText(lead,540,cy-140);
  x.fillStyle='#fff';x.fillText(tail,540,cy+140);
 }else if(variant==='vhs'){
  x.fillStyle='rgba(0,0,0,.25)';for(let yy=0;yy<H;yy+=6)x.fillRect(0,yy,W,2);
  x.font='900 116px CapCairo,sans-serif';const fit=Math.min(1,880/x.measureText(hero).width);x.save();x.translate(540+Math.sin(t*3)*3,cy);x.scale(fit,fit);
  x.shadowColor='#0ff';x.shadowBlur=0;x.fillStyle='rgba(0,255,255,.6)';x.fillText(hero,4,0);x.fillStyle='rgba(255,0,120,.6)';x.fillText(hero,-4,0);x.fillStyle='#f4f4ed';x.fillText(hero,0,0);x.restore();
  x.font='700 54px CapAmiri,sans-serif';x.fillStyle='#f4f4ed';x.fillText(lead,540,cy-150);x.fillText(tail,540,cy+150);
  x.font='400 30px monospace';x.textAlign='left';x.fillStyle='rgba(255,255,255,.8)';x.fillText('PLAY ▶',40,60);
 }else if(variant==='bigword'){
  const words=hero.split(' ');const big=words[words.length>1?1:0];
  x.font='900 260px CapCairo,sans-serif';const fit=Math.min(1,980/x.measureText(big).width);
  const q=ease2(a/.5);
  x.save();x.translate(540,cy);x.scale(fit*q,fit*q);x.globalAlpha=fade*Math.min(1,a/.3);
  const g=x.createLinearGradient(0,-140,0,140);g.addColorStop(0,'#efffa9');g.addColorStop(.5,'#a9ffd0');g.addColorStop(1,'#6decff');x.fillStyle=g;x.fillText(big,0,0);x.restore();
  x.font='700 56px CapAmiri,sans-serif';x.fillStyle='#f4f4ed';x.fillText(lead,540,cy-240);x.fillText(tail,540,cy+240);
 }else if(variant==='comic'){
  x.save();x.translate(540,cy);x.rotate(-.04);
  x.fillStyle='#ffca3a';x.beginPath();const R=340,r=190,n=14;for(let k=0;k<n*2;k++){const ang=k*Math.PI/n,rr=k%2?r:R;x.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}x.closePath();x.fill();
  x.strokeStyle='#111';x.lineWidth=10;x.stroke();
  x.font='900 110px CapCairo,sans-serif';const fit=Math.min(1,560/x.measureText(hero).width);x.scale(fit,fit);
  x.fillStyle='#e01e2b';x.strokeStyle='#111';x.lineWidth=8;x.lineJoin='round';x.strokeText(hero,0,0);x.fillText(hero,0,0);x.restore();
  x.font='700 56px CapAmiri,sans-serif';x.fillStyle='#fff';x.fillText(lead,540,cy-330);x.fillText(tail,540,cy+330);
 }else if(variant==='cyber'){
  x.fillStyle='rgba(255,0,153,.85)';x.fillRect(240,cy-150,600,120);
  x.fillStyle='rgba(0,229,255,.85)';x.fillRect(240,cy-10,600,120);
  x.font='900 104px CapCairo,sans-serif';const fit=Math.min(1,560/x.measureText(hero).width);x.save();x.translate(540,cy+50);x.scale(fit,fit);x.fillStyle='#0b0b14';x.fillText(hero,0,0);x.restore();
  x.font='700 56px CapAmiri,sans-serif';x.fillStyle='#fff';x.fillText(lead,540,cy-90);
  x.font='700 52px CapAmiri,sans-serif';x.fillStyle='#ffe45b';x.fillText(tail,540,cy+180);
 }else if(variant==='center'){
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,W,H);
  x.font='400 44px CapAmiri,sans-serif';x.fillStyle='#cfcfcf';x.globalAlpha=fade*enter;x.fillText(lead,540,cy-120);
  x.font='700 96px CapCairo,sans-serif';const fit=Math.min(1,880/x.measureText(hero).width);x.save();x.translate(540,cy);x.scale(fit,fit);x.fillStyle='#fff';x.fillText(hero,0,0);x.restore();
  x.font='400 44px CapAmiri,sans-serif';x.fillStyle='#cfcfcf';x.fillText(tail,540,cy+120);
  x.fillStyle='#fff';x.fillRect(500,cy+90,80,2);
 }else if(variant==='waver'){
  x.font='900 100px CapCairo,sans-serif';
  const words2=hero.split(' ');const widths=words2.map(w=>x.measureText(w).width),gap=30,total=widths.reduce((p,n)=>p+n,0)+gap*(words2.length-1),fit=Math.min(1,900/total);
  x.save();x.translate(540,cy);x.scale(fit,fit);let cursor=total/2;
  words2.forEach((w,i)=>{const ww=widths[i];const yy=Math.sin(a*3+i*1.1)*46;x.save();x.translate(cursor-ww/2,yy);x.rotate(Math.cos(a*3+i*1.1)*.06);
   x.fillStyle=['#efffa9','#a9ffd0','#6decff'][i%3];x.lineWidth=6;x.strokeStyle='rgba(0,0,0,.6)';x.lineJoin='round';x.strokeText(w,0,0);x.fillText(w,0,0);x.restore();cursor-=ww+gap});
  x.restore();
  x.font='700 52px CapAmiri,sans-serif';x.fillStyle='#f4f4ed';x.fillText(lead,540,cy-190);x.fillText(tail,540,cy+190);
 }
 x.restore();
}
function paint(c,v,t,scenes){
 const x=c.getContext('2d'),W=c.width,H=c.height,k=W/1080;
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#221040');g.addColorStop(1,'#0f0f1a');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.scale(k,k);
 const z=scenes.find(s=>t>=s.s&&t<s.e);
 if(z){
  const style=window.STYLE||'karaoke';
  if(SCENE_STYLES[style])scenePaint(x,v,t,z,style);else{const o=SUB[style]||SUB.karaoke;subPaint(x,t,z,o)}
 }
 x.restore();
}
window.STYLE='karaoke';
document.getElementById('style').onchange=e=>{window.STYLE=e.target.value;};

<script type="module">// YAMO Captions tool: audio -> whisper (client-side) -> styled captions -> webm export
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
env.allowLocalModels = false;
const $ = id => document.getElementById(id);
const log = m => { const d=$('log'); d.textContent += m + '\n'; d.scrollTop = d.scrollHeight; };
let ASR = null, audioBuf = null, audioURL = null, style = 'karaoke';
let SEGS = [];

async function getASR(cb) {
  if (ASR) return ASR;
  let hasGPU = false;
  try { hasGPU = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch (e) { hasGPU = false; }
  log(hasGPU ? 'WebGPU متاح — التفريغ هيكون أسرع' : 'مفيش WebGPU — التفريغ على المعالج (أبطأ)');
  ASR = await pipeline('automatic-speech-recognition', 'onnx-community/whisper-large-v3-turbo', {
    dtype: 'q4', device: hasGPU ? 'webgpu' : 'wasm',
    progress_callback: p => { if (p.status === 'progress' && cb) cb(p); }
  });
  return ASR;
}

$('file').onchange = () => {
  const f = $('file').files[0]; if (!f) return;
  audioURL = URL.createObjectURL(f);
  $('player').src = audioURL;
  $('go').disabled = false;
  log('الملف: ' + f.name + ' (' + Math.round(f.size/1024) + ' KB)');
};

$('go').onclick = async () => {
  const f = $('file').files[0]; if (!f) return;
  $('go').disabled = true; $('prog-wrap').hidden = false;
  try {
    log('بيجهّز الموديل (أول مرة بس — بينزل ~800MB ويتخزن)...');
    const asr = await getASR(p => { if (p.total) { $('prog').value = p.loaded / p.total * 100; $('prog-txt').textContent = Math.round(p.loaded/1e6) + 'MB / ' + Math.round(p.total/1e6) + 'MB'; } });
    log('الموديل جاهز. بيفك الصوت...');
    const raw = await f.arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    audioBuf = await ac.decodeAudioData(raw);
    const ch = audioBuf.getChannelData(0);
    log('بيفرّغ الصوت... (' + Math.round(audioBuf.duration) + ' ثانية)');
    const t0 = performance.now();
    const out = await asr(ch, { language: 'arabic', task: 'transcribe', return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 });
    log('التفريغ خلص في ' + Math.round((performance.now()-t0)/1000) + ' ثانية');
    window.WORDS = []; window.WORDS = window.WORDS;
    for (const c of (out.chunks || [])) {
      const ws = c.text.trim().split(/\s+/).filter(Boolean);
      const t0c = c.timestamp[0] ?? 0, t1c = c.timestamp[1] ?? (t0c + ws.length * 0.4);
      ws.forEach((w, i) => window.WORDS.push({ text: w, start: t0c + (t1c - t0c) * i / ws.length, end: t0c + (t1c - t0c) * (i + 1) / ws.length }));
    }
    if (!window.WORDS.length) { log('مفيش كلام اتكشف في الصوت!'); return; }
    // group into scenes ~3s
    SEGS = []; let cur = null;
    for (let i = 0; i < window.WORDS.length; i++) {
      const w = window.WORDS[i];
      if (!cur || w.start - cur.s > 3 || i - cur.from >= 7) { cur = { from: i, to: i, s: w.start, e: w.end, lead:'', hero:w.text, tail:'' }; SEGS.push(cur); }
      else { cur.to = i; cur.e = w.end; cur.hero += ' ' + w.text; }
    }
    window.WORDS = window.WORDS;
    $('text').value = window.WORDS.map(w => w.text).join(' ');
    $('step2').hidden = false;
    $('player').onseeked = $('player').ontimeupdate = () => paintFrame();
    paintFrame();
    log('المعاينة جاهزة — اختار ستايل وشغّل');
  } catch (e) { log('خطأ: ' + e.message); }
  $('go').disabled = false;
};

const SUBSET = ['karaoke','marker','pop','glowcyan','wordlight','classic','boxed','yellow','gradient','pill','lowerthird','meme','twotone','arabesque','typewriter','bounce','glitch','vhs','bigword','comic','cyber','center','waver','neon'];
$('style').innerHTML = SUBSET.map(s => '<option value="' + s + '">' + (SUB[s] ? SUB[s].name : SCENE_STYLES[s]) + '</option>').join('');
$('style').onchange = e => { style = e.target.value; paintFrame(); };

function paintFrame() {
  const v = $('player');
  paint($('c'), v, v.currentTime || 0, SEGS);
}

// export webm
$('export').onclick = async () => {
  const v = $('player'); if (!SEGS.length) return;
  $('export').disabled = true;
  const c = $('c');
  const stream = c.captureStream(30);
  const ac = new AudioContext();
  const src = ac.createMediaElementSource(v);
  const dest = ac.createMediaStreamDestination();
  src.connect(dest); src.connect(ac.destination);
  const merged = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const rec = new MediaRecorder(merged, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm' });
  const parts = []; rec.ondataavailable = e => parts.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(parts, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'yamo-caption.webm'; a.click();
    log('اتصدّر الفيديو (webm). للـ Premiere: حمّل ملف الـ SRT واستورده كـ caption track');
    $('export').disabled = false;
  };
  v.currentTime = 0; await v.play();
  cancelAnimationFrame(window.__raf);
  const loop = () => { paintFrame(); window.__raf = requestAnimationFrame(loop); };
  loop(); rec.start(200);
  v.onended = () => { rec.stop(); cancelAnimationFrame(window.__raf); v.onended = null; };
  log('بيصدّر الفيديو...');
};

// SRT export
$('srt').onclick = () => {
  if (!SEGS.length) return;
  const ts = t => { const h = String(Math.floor(t/3600)).padStart(2,'0'), m = String(Math.floor(t%3600/60)).padStart(2,'0'), s = String(Math.floor(t%60)).padStart(2,'0'), ms = String(Math.round(t%1*1000)).padStart(3,'0'); return h+':'+m+':'+s+','+ms; };
  const srt = SEGS.map((z,i) => (i+1) + '\n' + ts(z.s) + ' --> ' + ts(z.e) + '\n' + window.WORDS.slice(z.from, z.to+1).map(w=>w.text).join(' ') + '\n').join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([srt], { type: 'text/plain' })); a.download = 'captions.srt'; a.click();
  log('اتصدّر ملف SRT — يتستورد في Premiere مباشرة');
};

// playback wiring
$('playb').onclick = async () => {
  const v = $('player');
  if (v.paused) { await v.play(); cancelAnimationFrame(window.__raf); const loop=()=>{paintFrame();window.__raf=requestAnimationFrame(loop)}; loop(); $('playb').textContent = 'وقّف'; }
  else { v.pause(); cancelAnimationFrame(window.__raf); $('playb').textContent = 'شغّل'; }
};
</script>
